name: CI

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      target_arch:
        description: '目标架构'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android-arm64
      build_type:
        description: '构建类型'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  # 原有的自动触发
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  build-java:
    name: Build Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew buildAll

      # This helps to upload only jar files into the build artifact
      - name: Copy Build Results to Temp
        run: |
          mkdir -p tmp/
          cp imgui-app/build/libs/*.jar tmp/
          cp imgui-binding/build/libs/*.jar tmp/
          cp imgui-lwjgl3/build/libs/*.jar tmp/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: java-libraries
          path: tmp/*.jar

  build-natives:
    name: Build Native (${{ matrix.target.os }} - ${{ matrix.target.type }})
    needs: build-java
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            type: linux
          - os: ubuntu-latest
            type: windows
          - os: macos-latest
            type: macos
          - os: ubuntu-latest
            type: android-arm64
    # 根据手动触发选择的架构来过滤构建目标
    if: |
      github.event_name != 'workflow_dispatch' || 
      github.event.inputs.target_arch == 'all' || 
      github.event.inputs.target_arch == matrix.target.type
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout Repository and Submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Dependencies (for Windows build)
        if: matrix.target.type == 'windows'
        run: sudo apt install mingw-w64

      - name: Install Dependencies (for Android ARM64 build)
        if: matrix.target.type == 'android-arm64'
        run: |
          sudo apt update
          sudo apt install -y ninja-build pkg-config
          
          # Download Android NDK
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r27c" >> $GITHUB_ENV
          echo "$(pwd)/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set Build Type
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "BUILD_TYPE=debug" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
          fi

      - name: Build
        run: |
          chmod +x buildSrc/scripts/build.sh
          if [ -n "$BUILD_TYPE" ]; then
            buildSrc/scripts/build.sh ${{ matrix.target.type }} $BUILD_TYPE
          else
            buildSrc/scripts/build.sh ${{ matrix.target.type }}
          fi

      - name: Verify Android ARM64 Build
        if: matrix.target.type == 'android-arm64'
        run: |
          # Verify that the generated .so files are actually ARM64
          find /tmp/imgui/dst/ -name "*.so" -exec file {} \;
          
          # Check if any x86_64 files accidentally got included
          if find /tmp/imgui/dst/ -name "*.so" -exec file {} \; | grep -q "x86-64"; then
            echo "ERROR: Found x86_64 .so files in android-arm64 build!"
            exit 1
          fi
          echo "Android ARM64 build verification passed"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-library-${{ matrix.target.type }}
          path: /tmp/imgui/dst/

  # This required to pack all native libraries into single archive
  archive-natives:
    name: Archive Natives
    runs-on: ubuntu-latest
    needs: build-natives
    if: always() && needs.build-natives.result == 'success'
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: native-libraries-${{ github.run_id }}
          pattern: native-library-*

  # 单独打包 Android ARM64 版本（方便快速下载）
  package-android:
    name: Package Android ARM64 Only
    runs-on: ubuntu-latest
    needs: build-natives
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_arch == 'android-arm64') ||
      (github.event_name != 'workflow_dispatch')
    steps:
      - name: Download Android ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: native-library-android-arm64
          path: ./android-libs

      - name: Create ZIP Archive
        run: |
          zip -r imgui-java-android-arm64.zip ./android-libs/
          
          # 显示文件信息
          echo "=========================================="
          echo "Android ARM64 Library Info:"
          file ./android-libs/*.so
          echo "=========================================="

      - name: Upload Android ARM64 Package
        uses: actions/upload-artifact@v7
        with:
          name: imgui-java-android-arm64-package
          path: imgui-java-android-arm64.zip

  update-bin:
    name: Update Binaries
    if: |
      github.ref == 'refs/heads/main' && 
      !github.event.repository.fork &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: archive-natives
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      # Job compares sha1 hash of the imgui-binding/src/main directory.
      # If there are any changes, then we update native libraries.
      # We do not rely on git in terms of comparing binaries,
      # since DLL files will always have versioning difference.
      - name: Compare Binding Hash
        id: cmp-binding-hash
        continue-on-error: true
        run: |
          touch bin/binding.sha1
          cat bin/binding.sha1 > /tmp/hash
          find imgui-binding/src/main -type f -print0 | sort -z | xargs -0 sha1sum > bin/binding.sha1
          find imgui-binding/src/generated -type f -print0 | sort -z | xargs -0 sha1sum >> bin/binding.sha1
          find include -type f -print0 | sort -z | xargs -0 sha1sum >> bin/binding.sha1
          cmp /tmp/hash bin/binding.sha1

      - name: Update
        if: steps.cmp-binding-hash.outcome != 'success'
        run: mv /tmp/artifacts/native-libraries-${{ github.run_id }}/* bin/

      - name: Commit
        if: steps.cmp-binding-hash.outcome != 'success'
        uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: '[ci skip] update native binaries'

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') # if tag starts with "v"
    runs-on: ubuntu-latest
    needs: [ build-java, archive-natives ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: out/artifacts

      - name: Zip Artifacts
        run: |
          mkdir out/archives
          zip -rj out/archives/native-libraries out/artifacts/native-libraries-*
          zip -rj out/archives/java-libraries out/artifacts/java-libraries

      - name: Publish
        env:
          NEXUS_UPD_ID: ${{ secrets.RELEASE_NEXUS_UPD_ID }}
          NEXUS_UPD_PASS: ${{ secrets.RELEASE_NEXUS_UPD_PASS }}
          SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_KEY_PASS: ${{ secrets.RELEASE_SIGNING_KEY_PASS }}
        run: |
          chmod +x ./buildSrc/scripts/publish.sh
          buildSrc/scripts/publish.sh

      - name: Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: false
          files: |
            out/archives/**
